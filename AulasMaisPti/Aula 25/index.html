<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device=width,initial-scale=1.0">
        <meta name="keywords" content="Desenvolvimento web, html , CSS e Javascript">
        <meta name="Author" content="Cassiolo">
        <title>Document</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            #form-container{
                background-color: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0px 4px 8px gray;
            }
            h2{
                display: flex;
                justify-content: center;
                align-items: center;
            }
            input[type="text"], input[type="email"], input[type="password"], select , textarea{
                width: 90%;
                border-color: rgb(233, 233, 233);
                padding: 10px;
                border: 1px solid ccc;
                border-radius: 4px;
            }
            button{
                padding: 8px 20px;
                background-color: rgb(63, 150, 63);
                border-radius: 5px;
                border: 0px;
                color: white;
                cursor: pointer;
                font-size: 16px;
                align-items: center;
            }
            label{
                margin-bottom: 8px;
                display: block;
            }

        </style>
        
    </head>
    
    <body>

    <header>
        
    </header>

    <div id="form-container">
        </section>
        <h2>Registro de usuario</h2>
        
        <label>Nome completo:</label>
        <input type="text" placeholder="Digite seu nome completo">
        <br>
        <br>
        <label>Email:</label>
        <input type="email" placeholder="Digite seu e-mail">
        <br>
        <br>
        <label>Senha:</label>
        <input type="password" placeholder="Digite sua senha">
        <br>
        <br>
        <label>Genero:</label>
        <label for="male">
              <input type="radio" name="gender" value="male">Maculino
        </label>       
        <label for="female">
              <input type="radio" name="gender" value="female">Feminino
        </label>     
        <label for="other">
              <input type="radio" name="gender" value="other">Outros
        </label>     

        <br>
        <label>Cidade:</label>
        <select name="city">
            <option value="sc">Jaragua</option>
            <option value="rs">Gravatai</option>
            <option value="rs">Campo bom</option>
            <option value="mg">Belo Horizonte</option>
            <option value="mg">Lagoa Santa</option>
        </select>
        <br>
        <br>
        <label for="message">Mensagem:</label>
        <textarea name="message" rows="4" placeholder="Deixe sua mensagem"></textarea>

        </section>
        <br>
        <br>
        <button>Cadastrar</button>

    </div>

    </body>
    
</html>
