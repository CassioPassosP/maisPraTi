  <body>
    <h1>Vanilla JavaScript</h1>
    <p>JavaScript Puro</p>

    <div>

                <li>É poderoso e flexível</li>
                <li>Possui um ecossistema muito ativo e versátil</li>
            </ul>
        </div>
    </div>
    <script>/*
        const selecao = document.getElementById("selecao")
        const content = document.getElementById("content")
        const buttonPq = document.getElementById("pq-react")
        const buttonPrin = document.getElementById("prin-react")
        const buttonRel = document.getElementById("rel-react")

        const content = document.getElementById("content");

        const info = {
           pq: [
                "React é extremamente popular",
                "Facilita a criação de interfaces de usuário complexas e interativas",
                "É poderoso e flexível",
                "Possui um ecossistema muito ativo e versátil"
               ],
           prin: [
                "Componentes, JSX e Props",
                "Estado",
                "Hooks",
                "Renderização dinâmica"
               ],
           rel: [
                "Página oficial",
                "Next.js (Framework Fullstack)",
                "React Native (Construa aplicativos móveis nativos com React)"
                ]
            };

            function renderContent(items) {
               //items.map(item => <li>${item}</li>)
               // O map percorre cada elemento do array items e cria uma string HTML <li> para ele.
               content.innerHTML = items.map(item => `<li>${item}</li>`).join(""); //join("") concatena todas as strings do array em uma só:
            }

            // Adiciona eventos dinamicamente
            document.getElementById("pq-react").addEventListener("click", () => renderContent(info.pq));
            document.getElementById("prin-react").addEventListener("click", () => renderContent(info.prin));
            document.getElementById("rel-react").addEventListener("click", () => renderContent(info.rel));
    </script>
