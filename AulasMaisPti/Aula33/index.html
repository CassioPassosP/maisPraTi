<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Lista de compras</h1>
    <form id="form-lista">
      <input type="text" id="input-item" placeholder="Adicionar um item..." required>
      <button type="submit">Adicionar</button>
      <button id="limpar" onclick="Limpalista()">Limpar lista</button>
    </form>

    <div class="controls">
      <span id="conunter-total">Total: 0</span>
      <span id="conunter-pendent">Pendentes: 0</span>
      <span id="conunter-purchased">Comprados: 0</span>
      <select id="filters-status">
          <option value="all">Todos</option>
          <option value="pending">Pendentes</option>
          <option value="purchased">Comprados</option>
      </select>
      <select id="ordenar">
          <option value="default">Ordem original</option>
          <option value="alphabetical">Ordem alfabetica</option>
          <option value="status">Por status</option>
      </select>
    </div>

    <ul id="lista-itens"></ul>
  </div>
<script src="Aula33.js"></script>
</body>
</html>
